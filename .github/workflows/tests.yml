name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[agent,dev]"
      - name: Ruff correctness checks
        run: ruff check src tests bench spikes
      - name: Run tests
        run: python -m pytest -q
      - name: Repeat checkpoint cancellation lifecycle gates
        run: |
          for ($i = 1; $i -le 5; $i++) {
            python -m pytest -q tests/test_service_cancellation.py tests/test_checkpoint_cancellation.py tests/api/test_runs_api.py::RunsApiTests::test_cancel_running_async_provider_emits_one_terminal_event
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Offline live-evaluation safety gates
        run: python -m bench.audit_live_runtime_matrix --output .bench-results/live-runner-audit.json
      - name: Offline task fixture production-path gates
        run: python -m bench.audit_runtime_task_fixtures --output .bench-results/task-fixtures-audit.json
      - name: Complete direct-factory supported scripted matrix (81 keys)
        run: python -m bench.run_supported_runtime_matrix --boundary direct_factory --output-dir .bench-results/supported-factory
      - name: Complete RunService supported scripted matrix (126 keys)
        run: python -m bench.run_supported_runtime_matrix --boundary run_service --output-dir .bench-results/supported-service
      - name: Repeat production MCP lifecycle and process-death gates
        run: |
          $env:PYTHONPATH = "$PWD;$PWD/tests"
          for ($i = 1; $i -le 3; $i++) {
            python -m pytest -q tests/mcp/test_client_manager.py tests/test_runtime_capabilities.py -k "MCPClientManager or real_local_mcp or actual_parent"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile sources
        run: python -m compileall -q src tests bench spikes
      - name: Preserve offline acceptance evidence including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-runtime-evidence-python-${{ matrix.python-version }}
          path: .bench-results/
          include-hidden-files: true
          if-no-files-found: ignore

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Typecheck Vue application
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Verify committed frontend bundle
        working-directory: .
        run: git diff --exit-code -- src/doppel_agent/web/frontend_dist
