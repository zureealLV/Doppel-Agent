name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e ".[agent,dev]"
      - name: Ruff correctness checks
        run: ruff check src tests bench spikes
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q src tests bench spikes

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Typecheck Vue application
        run: npm run typecheck
      - name: Build production frontend
        run: npm run build
      - name: Verify committed frontend bundle
        working-directory: .
        run: git diff --exit-code -- src/doppel_agent/web/frontend_dist
